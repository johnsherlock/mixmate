<script>
(()=>{

const desks=[0,1].map(()=>({groups:clone(groupDefaults),mixes:newMixes()}));
let activeDesk=0,availability='Desk A',aux=-1,mode='groups',expanded=null,drawMode=false,recording=false,recordSeconds=0,dirty=false;

let stateRevision=Number.isInteger(saved?.revision)?saved.revision:0;
if(saved&&saved.version===4){activeDesk=saved.activeDesk===null?null:saved.activeDesk===1?1:0;aux=Number.isInteger(saved.aux)&&saved.aux>=-1&&saved.aux<5?saved.aux:-1;mode=['groups','channels','eq'].includes(saved.mode)?saved.mode:'groups';expanded=Number.isInteger(saved.expanded)&&saved.expanded>=0&&saved.expanded<3?saved.expanded:null;}
function current(){return desks[activeDesk??0];}function mix(){return current().mixes[aux<0?0:aux];}function groups(){return current().groups;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function db(v){return(v>0?'+':'')+v.toFixed(1)+' dB';}function panLabel(v){return v===0?'PAN · CENTRE':`PAN · ${v<0?'L':'R'} ${Math.abs(v)}`;}

function meter(i,stereo=true){return `<div class="mm-meter-pair" aria-label="Simulated signal level"><span class="mm-clip ${i===7?'mm-hot':''}" aria-label="${i===7?'Clipping held':'No clipping'}"></span>${[55+i*7%30,52+i*9%29].slice(0,stereo?2:1).map(v=>`<div class="mm-meter"><i style="--level:${v}%"></i></div>`).join('')}</div>`;}
function ruler(min=-60,max=10){const values=min===-60&&max===10?[10,0,-12,-24,-40,-60]:[max,0,min];return `<div class="mm-ruler">${values.map(v=>`<span style="top:${(max-v)/(max-min||1)*100}%">${v>0?'+':''}${Math.round(v)}</span>`).join('')}</div>`;}
function masterStrip(i){const m=current().mixes[i];return `<article class="mm-strip mm-master" style="--mm-strip-color:${mixColours[i]}"><div class="mm-strip-head"><button class="mm-strip-name" data-open-aux="${i}">${esc(m.name)}</button><span class="mm-strip-detail">AUX ${i*2+1}/${i*2+2} · STEREO</span></div><output class="mm-value" data-master-value="${i}">${db(m.master)}</output><div class="mm-fader-space">${ruler()}<input class="mm-vertical" type="range" min="-60" max="10" step="0.5" value="${m.master}" data-master="${i}" aria-keyshortcuts="Enter" aria-description="Drag to change level. Double tap or press Enter to open AUX EQ." aria-label="${esc(m.name)} AUX master level" />${meter(i)}</div></article>`;}
function bounds(g){const m=mix(),off=m.offsets[g]||0,levels=groups()[g].members.map(i=>m.levels[i]-off);return levels.length?{min:Math.max(...levels.map(v=>-60-v)),max:Math.min(...levels.map(v=>10-v))}:{min:0,max:0};}
function groupStrip(g){const group=groups()[g],b=bounds(g),off=mix().offsets[g]||0;return `<article class="mm-strip mm-group"><div class="mm-strip-head"><button class="mm-strip-name" data-expand="${g}">${esc(group.name)} ${expanded===g?'−':'+'}</button>${expanded===g?'<span class="mm-group-master-label">GROUP MASTER</span>':''}<span class="mm-strip-detail">${group.members.length} send${group.members.length===1?'':'s'} · relative dB</span></div><output class="mm-value" data-group-value="${g}">${db(off)}</output><div class="mm-fader-space">${ruler(b.min,b.max)}<input class="mm-vertical" type="range" min="${b.min}" max="${b.max}" step="0.5" value="${off}" data-group="${g}" aria-label="${esc(group.name)} relative AUX send level" ${!group.members.length?'disabled':''} />${meter(g,false)}</div><span class="mm-limit" data-group-limit="${g}">${off>=b.max-.05?'UPPER LIMIT':off<=b.min+.05?'LOWER LIMIT':''}</span></article>`;}
function channelStrip(i,native=false){const m=mix();return `<article class="mm-strip mm-channel"><div class="mm-strip-head"><button class="mm-strip-name" data-pan="${i}" ${native?'disabled':''}>${esc(channels[i])}</button><span class="mm-strip-detail">${i<24?i+1:`FX ${i-23}`} · AUX SEND</span></div><output class="mm-value" data-channel-value="${i}">${db(m.levels[i])}</output><div class="mm-fader-space">${ruler()}<input class="mm-vertical" type="range" min="-60" max="10" step="0.5" value="${m.levels[i]}" data-channel="${i}" aria-label="${esc(channels[i])} AUX send level" ${native?'disabled':''} />${meter(i,i===4||i===5)}</div><button class="mm-pan-button" data-pan="${i}" ${native?'disabled':''}>${panLabel(m.pans[i])}</button></article>`;}
function render(){
 graphObserver?.disconnect();root.dataset.auxView=String(aux>=0);root.style.setProperty('--mm-mix-color',mixColours[aux]||'#e1d067');
 $('.mm-mix-tabs').innerHTML='';$('.mm-navigation').hidden=aux<0;
 $('.mm-group-switches').hidden=aux<0;$('.mm-group-switches').innerHTML=aux>=0?groups().map((g,i)=>`<button data-jump-group="${i}" class="${mode==='groups'&&i===expanded?'mm-active':''}">${esc(g.name)}</button>`).join('')+`<button data-mode="channels" class="${mode==='channels'?'mm-active':''}">All Channels</button>`:'';

 $$('[data-mode]').forEach(b=>b.classList.toggle('mm-active',b.dataset.mode===mode));

 else {const strips=mode==='channels'?channels.map((n,i)=>channelStrip(i)).join(''):expanded===null?groups().map((g,i)=>groupStrip(i)).join(''):groupStrip(expanded)+groups()[expanded].members.map(i=>channelStrip(i)).join('');$('.mm-content').innerHTML=`<div class="mm-sends-layout ${mode==='groups'&&expanded!==null?'mm-no-master':''}"><div class="mm-sends-main"><div class="mm-strip-scroll ${expanded!==null?'mm-expanded':''}">${strips}</div></div>${mode==='groups'&&expanded!==null?'':`<aside class="mm-pinned" aria-label="Current AUX master">${masterStrip(aux)}</aside>`}</div>`;}

function sample(curve,x){const k=clamp(x,0,1)*160,i=Math.floor(k);return curve[i]+(curve[Math.min(160,i+1)]-curve[i])*(k-i);}
function freq(x){return 20*Math.pow(1000,x);}function logFreq(f){return clamp(Math.log(f/20)/Math.log(1000),0,1);}function hz(f){return f>=1000?(f/1000).toFixed(f<10000?2:1)+' kHz':Math.round(f)+' Hz';}
function cuts(eq,x){const f=freq(x);return (eq.lowEnabled&&f<eq.lowHz?-12*Math.log2(eq.lowHz/f):0)+(eq.highEnabled&&f>eq.highHz?-12*Math.log2(f/eq.highHz):0);}
function paramGain(eq,x,ignore=-1){return eq.bands.reduce((total,b,i)=>{if(i===ignore)return total;const width=.13/Math.sqrt(b.q);return total+b.gain*Math.exp(-.5*Math.pow((x-b.x)/width,2));},0);}
function activeCurve(eq){return drawMode?eq.curve:Array.from({length:161},(_,i)=>paramGain(eq,i/160));}
function renderEQ(){const eq=mix().eq;drawMode=eq.mode==='draw';$('.mm-content').innerHTML=`<div class="mm-eq-shell mm-eq-native"><div class="mm-eq-plot"><svg class="mm-eq-svg" role="img" aria-label="AUX EQ curve. Drag points for frequency and gain. Use right-hand faders for frequency, Q and gain."><defs><linearGradient id="mm-eq-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a0bd8b" stop-opacity=".30"/><stop offset="1" stop-color="#a0bd8b" stop-opacity=".02"/></linearGradient></defs><g class="mm-eq-grid"></g><path class="mm-eq-area" fill="url(#mm-eq-fill)"/><path class="mm-eq-curve" fill="none" stroke="#dce6d0" stroke-width="2"/><g class="mm-eq-handles"></g></svg></div><aside class="mm-eq-sidebar" aria-label="EQ controls"><div class="mm-eq-mode"><button data-action="eq-points" class="${!drawMode?'mm-active':''}" aria-label="Three EQ points" title="Three points">•••</button><button data-action="eq-draw" class="${drawMode?'mm-active':''}" aria-label="Draw curve" title="Draw curve">✎</button><button data-action="reset-eq" aria-label="Reset EQ" title="Reset EQ">↺</button></div><div class="mm-band-tabs" aria-label="Selected EQ point">${[0,1,2].map(i=>`<button data-select-band="${i}" aria-pressed="${!drawMode&&selectedBand===i}" class="${!drawMode&&selectedBand===i?'mm-active':''}" ${drawMode?'disabled':''}>${i+1}</button>`).join('')}</div><div class="mm-eq-param-bank">${[['freq','FREQ',0,1,.001],['q','Q',0,1,.001],['gain','GAIN',-12,12,.1]].map(([id,label,min,max,step])=>`<label class="mm-eq-param"><span>${label}</span><output data-eq-value="${id}"></output><input class="mm-vertical" type="range" min="${min}" max="${max}" step="${step}" value="0" data-eq-param="${id}" aria-label="Selected EQ point ${id==='freq'?'frequency':id==='q'?'Q':'gain'}" ${drawMode?'disabled':''}/></label>`).join('')}</div><div class="mm-eq-cut-bank">${['low','high'].map(c=>`<button data-toggle-cut="${c}" aria-pressed="${eq[c+'Enabled']}" class="${eq[c+'Enabled']?'mm-active':''}" function syncEQControls(){if(!$('.mm-eq-param-bank'))return;const eq=mix().eq,b=eq.bands[selectedBand],values={freq:b.x,q:Math.log(b.q/.1)/Math.log(100),gain:b.gain};for(const id of ['freq','q','gain']){$(`[data-eq-param="${id}"]`).value=values[id];$(`[data-eq-value="${id}"]`).textContent=drawMode?'—':id==='freq'?hz(freq(b.x)):id==='q'?b.q.toFixed(2):(b.gain>0?'+':'')+b.gain.toFixed(1);}$$('.mm-band-tabs button').forEach(el=>{const chosen=!drawMode&&+el.dataset.selectBand===selectedBand;el.classList.toggle('mm-active',chosen);el.setAttribute('aria-pressed',String(chosen));});}
function graphGeometry(){const el=$('.mm-eq-svg');if(!el)return null;const r=el.getBoundingClientRect(),w=Math.max(150,r.width),h=Math.max(80,r.height);return {w,h,left:w<260?28:35,right:w-14,top:14,bottom:h-25,range:h-39};}
function paintEQ(){const svg=$('.mm-eq-svg');if(!svg||aux<0)return;const eq=mix().eq,g=graphGeometry(),x=v=>g.left+v*(g.right-g.left),y=v=>g.top+(15-clamp(v,-15,15))/30*g.range;svg.setAttribute('viewBox',`0 0 ${g.w} ${g.h}`);$('.mm-eq-grid').innerHTML=`<rect x="${g.left}" y="${g.top}" width="${g.right-g.left}" height="${g.range}" fill="#111a20"/>${[-12,0,12].map(v=>`<line x1="${g.left}" x2="${g.right}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#76838a':'#34434e'}"/><text x="${g.left-4}" y="${y(v)+4}" text-anchor="end">${v>0?'+':''}${v}</text>`).join('')}${(g.w<300?[20,1000,20000]:g.w<500?[20,100,1000,20000]:[20,100,1000,10000,20000]).map(f=>`<line x1="${x(logFreq(f))}" x2="${x(logFreq(f))}" y1="${g.top}" y2="${g.bottom}" stroke="#34434e"/><text x="${x(logFreq(f))}" y="${g.h-7}" text-anchor="${f===20?'start':f===20000?'end':'middle'}">${f>=1000?f/1000+'k':f}</text>`).join('')}`;const samples=activeCurve(eq),curve=samples.map((v,i)=>`${i?'L':'M'}${x(i/160).toFixed(2)},${y(v+cuts(eq,i/160)).toFixed(2)}`).join(' ');$('.mm-eq-curve').setAttribute('d',curve);$('.mm-eq-area').setAttribute('d',`M${g.left},${y(0)} ${curve.replace(/^M/,'L')} L${g.right},${y(0)} Z`);let handles=drawMode?'':eq.bands.map((b,i)=>{const yy=y(paramGain(eq,b.x)+cuts(eq,b.x));return `<g class="mm-eq-handle" data-band="${i}" role="button" aria-label="EQ point ${i+1}, ${hz(freq(b.x))}"><circle cx="${x(b.x)}" cy="${yy}" r="20" fill="#abbea0" fill-opacity=".18"/><circle cx="${x(b.x)}" cy="${yy}" r="12" fill="${i===selectedBand?'#ecd3a7':'#bcc7a8'}" stroke="#879b80"/><text x="${x(b.x)}" y="${yy+4}" text-anchor="middle" style="fill:#26312b">${i+1}</text></g>`;}).join('');for(const cut of ['low','high'])if(eq[cut+'Enabled']){const xx=x(logFreq(eq[cut+'Hz'])),yy=g.top+15;handles+=`<g class="mm-eq-handle" data-cut="${cut}" role="button" aria-label="${cut==='low'?'Low':'High'} cut handle"><line x1="${xx}" x2="${xx}" y1="${yy+12}" y2="${g.bottom}" stroke="${cut==='low'?'#7caabb':'#c7a16d'}" stroke-dasharray="3 4"/><circle cx="${xx}" cy="${yy}" r="14" fill="${cut==='low'?'#436d7b':'#83653c'}"/><text x="${xx}" y="${yy+4}" text-anchor="middle" style="fill:#edf1ee">${cut==='low'?'LC':'HC'}</text></g>`;}$('.mm-eq-handles').innerHTML=handles;syncEQControls();}
function graphPoint(e){const svg=$('.mm-eq-svg'),r=svg.getBoundingClientRect(),g=graphGeometry();return {x:clamp((e.clientX-r.left-g.left)/(g.right-g.left),0,1),gain:clamp(15-(e.clientY-r.top-g.top)/g.range*30,-12,12)};}
function graphMove(e){const eq=mix().eq,p=graphPoint(e);if(eqDrag?.cut){const c=eqDrag.cut;eq[c+'Hz']=Math.round(clamp(freq(p.x),c==='low'?20:1000,c==='low'?400:20000));paintEQ();modified();return;}if(drawLast){const idx=Math.round(p.x*160),from=drawLast.index,a=drawLast.gain,b=p.gain;for(let i=Math.min(idx,from);i<=Math.max(idx,from);i++){const t=idx===from?1:(i-from)/(idx-from);eq.curve[i]=clamp(a+(b-a)*t-cuts(eq,i/160),-12,12);}drawLast={index:idx,gain:p.gain};paintEQ();modified();return;}if(eqDrag?.band!==undefined){const b=eq.bands[eqDrag.band],x=clamp(p.x,0,1);b.x=x;b.gain=clamp(p.gain-cuts(eq,x)-paramGain(eq,x,eqDrag.band),-12,12);paintEQ();modified();}}

root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.openAux!==undefined){aux=+b.dataset.openAux;mode='groups';expanded=null;render();remember();return;}if(b.dataset.jumpGroup!==undefined){expanded=mode==='groups'&&expanded===+b.dataset.jumpGroup?null:+b.dataset.jumpGroup;mode='groups';render();remember();return;}if(b.dataset.toggleCut){const c=b.dataset.toggleCut;mix().eq[c+'Enabled']=!mix().eq[c+'Enabled'];renderEQ();modified();return;}if(b.dataset.editGroup!==undefined){openEditor(+b.dataset.editGroup);return;}if(b.dataset.selectBand!==undefined){selectedBand=+b.dataset.selectBand;paintEQ();return;}if(b.dataset.mode){mode=b.dataset.mode;expanded=null;render();remember();return;}if(b.dataset.expand!==undefined){expanded=expanded===+b.dataset.expand?null:+b.dataset.expand;render();remember();return;}if(b.dataset.eq!==undefined){aux=+b.dataset.eq;mode='eq';render();remember();return;}if(b.dataset.pan!==undefined){openPan(+b.dataset.pan);return;}if(b.dataset.panPreset!==undefined){setPan(+b.dataset.panPreset);return;}if(b.dataset.toggleMember!==undefined&&editor){const i=+b.dataset.toggleMember,n=editor.members.indexOf(i);if(n<0)editor.members.push(i);else editor.members.splice(n,1);renderEditor();return;}if(b.dataset.connectDesk!==undefined){connectDesk(+b.dataset.connectDesk);return;}
 switch(b.dataset.action){case'overview':aux=-1;expanded=null;render();remember();break;case'collapse':expanded=null;render();remember();break;case'close-dialog':closeDialog();break;case'snapshots':openSnapshots();break;case'save':openDialog('Save current snapshot',`<p class="mm-warning">Overwrite “${esc($('.mm-snapshot-name').textContent)}” with the current desk settings?</p><div class="mm-dialog-actions"><button data-action="close-dialog">Cancel</button><button data-action="confirm-save" class="mm-primary">Save snapshot</button></div>`);break;case'confirm-save':dirty=false;$('.mm-snapshot').dataset.dirty='false';$('.mm-dirty').textContent='Snapshot saved';feedback('Snapshot saved · preview');closeDialog();break;case'recall':$('.mm-snapshot-name').textContent=$('#mm-snapshot-select').value;dirty=false;$('.mm-snapshot').dataset.dirty='false';$('.mm-dirty').textContent='Snapshot saved';feedback('Snapshot recalled · preview');closeDialog();break;case'record':if(recording)openDialog('Stop multitrack recording?',`<p class="mm-caption">Current take · ${formatTime(recordSeconds)}</p><div class="mm-dialog-actions"><button data-action="close-dialog">Keep recording</button><button data-action="stop-record" class="mm-primary">Stop recording</button></div>`);else{recording=true;recordSeconds=0;paintRecord();}break;case'stop-record':recording=false;paintRecord();closeDialog();break;case'native':$('.mm-native-content').innerHTML=`<div class="mm-strip-scroll">${channels.slice(0,8).map((n,i)=>channelStrip(i,true)).join('')}</div>`;$('.mm-native-snapshot').textContent=$('.mm-snapshot-name').textContent;$('.mm-native-layer').hidden=false;prepareFaders();$('.mm-native-head button').focus();break;case'close-native':$('.mm-native-layer').hidden=true;$('[data-action="native"]').focus();break;

root.addEventListener('input',e=>{const el=e.target;if(el.dataset.master!==undefined){const i=+el.dataset.master;current().mixes[i].master=+el.value;$(`[data-master-value="${i}"]`).textContent=db(+el.value);modified();}if(el.dataset.channel!==undefined&&!$('.mm-native-layer').contains(el)){const i=+el.dataset.channel;mix().levels[i]=+el.value;$$(`[data-channel-value="${i}"]`).forEach(o=>o.textContent=db(+el.value));groups().forEach((g,n)=>{if(g.members.includes(i))mix().offsets[n]=0;});modified();}if(el.dataset.group!==undefined){const g=+el.dataset.group,m=mix(),old=m.offsets[g]||0,b=bounds(g),v=clamp(+el.value,b.min,b.max),delta=v-old;groups()[g].members.forEach(i=>m.levels[i]=clamp(m.levels[i]+delta,-60,10));m.offsets[g]=v;groups().forEach((other,n)=>{if(n!==g&&other.members.some(i=>groups()[g].members.includes(i)))m.offsets[n]=0;});$(`[data-group-value="${g}"]`).textContent=db(v);$(`[data-group-limit="${g}"]`).textContent=v>=b.max-.05?'UPPER LIMIT':v<=b.min+.05?'LOWER LIMIT':'';groups()[g].members.forEach(i=>{$$(`[data-channel-value="${i}"]`).forEach(o=>o.textContent=db(m.levels[i]));const input=$(`[data-channel="${i}"]`);if(input)input.value=m.levels[i];});modified();}if(el.classList.contains('mm-pan-large'))setPan(+el.value);if(el.dataset.eqParam&&!drawMode){const b=mix().eq.bands[selectedBand],v=+el.value;if(el.dataset.eqParam==='freq')b.x=v;else if(el.dataset.eqParam==='q')b.q=.1*Math.pow(100,v);else b.gain=v;paintEQ();modified();}if(el.dataset.cutFrequency){const c=el.dataset.cutFrequency;if(el.value==='')return;mix().eq[c+'Hz']=clamp(+el.value,c==='low'?20:1000,c==='low'?400:20000);paintEQ();modified();}});

let faderGesture=null,lastFaderTap=null;

function prepareFaders(){
 $$('input.mm-vertical[data-channel],input.mm-vertical[data-group],input.mm-vertical[data-master]').forEach(el=>{
  if(el.parentElement.classList.contains('mm-fader-control'))return;

  el.before(wrap);wrap.append(el);
  const cap=document.createElement('span');cap.className='mm-fader-hit';cap.setAttribute('aria-hidden','true');wrap.append(cap);
 });

function syncFaderHandles(){
 $$('.mm-fader-control').forEach(wrap=>{const el=wrap.querySelector('input'),cap=wrap.querySelector('.mm-fader-hit'),h=el.getBoundingClientRect().height;
  const ratio=(+el.value-+el.min)/(+el.max-+el.min||1);

 });
}
function setGestureValue(g,value){

root.addEventListener('input',syncFaderHandles);
root.addEventListener('pointerdown',e=>{

});
root.addEventListener('pointermove',e=>{

 setGestureValue(g,g.start+(g.y-e.clientY)/travel*(+g.el.max-+g.el.min));

root.addEventListener('pointerup',e=>{

 const now=performance.now(),last=lastFaderTap;
 if(last&&last.el===g.el&&last.cap===g.cap&&now-last.time<380&&Math.hypot(e.clientX-last.x,e.clientY-last.y)<24){
  lastFaderTap=null;
  if(g.cap&&g.el.dataset.master!==undefined){openMasterEQ(+g.el.dataset.master);return;}
  if(!g.cap){const rect=g.el.getBoundingClientRect(),ratio=clamp((rect.bottom-14.5-e.clientY)/Math.max(20,rect.height-29),0,1);setGestureValue(g,+g.el.min+ratio*(+g.el.max-+g.el.min));g.el.dispatchEvent(new Event('change',{bubbles:true}));}
 }else lastFaderTap={el:g.el,cap:g.cap,time:now,x:e.clientX,y:e.clientY};
});

clock();const timer=setInterval(()=>{if(!root.isConnected){clearInterval(timer);graphObserver?.disconnect();layoutObserver.disconnect();return;}clock();if(recording){recordSeconds++;paintRecord();}},1000);
